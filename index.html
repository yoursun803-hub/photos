<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>❤️ 想我的時候才能看喔！</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #4a4a4a;
            overflow: hidden;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.85);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
            backdrop-filter: blur(5px);
            position: relative;
        }

        h1 {
            font-size: 1.5rem;
            color: #e85d75;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        /* 按鈕樣式 */
        .btn {
            background-color: #ff6b81;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 107, 129, 0.4);
            transition: all 0.3s ease;
            outline: none;
        }

        .btn:hover {
            background-color: #ff4757;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 129, 0.6);
        }

        .btn:active {
            transform: translateY(1px);
        }

        /* 抽卡動畫區域 */
        .card-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .card-wrapper {
            width: 220px;
            height: 300px;
            perspective: 1000px;
            margin-bottom: 20px;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* 抽卡洗牌動畫 */
        @keyframes shuffle {
            0% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(-10deg) scale(1.05) translateY(-10px); }
            50% { transform: rotate(10deg) scale(0.95) translateY(10px); }
            75% { transform: rotate(-5deg) scale(1.02); }
            100% { transform: rotate(0deg) scale(1); }
        }

        .shuffling {
            animation: shuffle 0.6s ease-in-out infinite;
        }

        /* 卡片正面與背面 */
        .card-front, .card-back {
            width: 100%;
            height: 100%;
            position: absolute;
            backface-visibility: hidden;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            overflow: hidden;
        }

        /* 卡牌背面（抽卡前） */
        .card-back {
            background: linear-gradient(45deg, #ff758c, #ff7eb3);
            border: 4px solid #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 3rem;
        }

        /* 卡牌正面（顯示照片） */
        .card-front {
            background-color: white;
            transform: rotateY(180deg);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-front img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        /* 結果文字 */
        .result-text {
            font-size: 1.4rem;
            font-weight: bold;
            color: #ff4757;
            opacity: 0;
            transition: opacity 0.5s ease;
            margin-top: 10px;
            min-height: 2em;
        }

        .result-text.show {
            opacity: 1;
        }

        .re-draw-btn {
            margin-top: 15px;
            display: none;
            background-color: #70a1ff;
        }

        .re-draw-btn:hover {
            background-color: #1e90ff;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 初始畫面 -->
        <div id="start-screen">
            <h1>❤️ 想我的時候才能看喔！</h1>
            <button class="btn" onclick="startDraw()">請抽卡！</button>
        </div>

        <!-- 抽卡與結果畫面 -->
        <div id="draw-screen" class="card-container">
            <div class="card-wrapper">
                <div class="card" id="card">
                    <div class="card-back">❤️</div>
                    <div class="card-front">
                        <img id="photo" src="" alt="照片">
                    </div>
                </div>
            </div>
            <div class="result-text" id="result-text"></div>
            <button class="btn re-draw-btn" id="redraw-btn" onclick="resetCard()">再抽一次</button>
        </div>
    </div>

    <script>
        // 1. 請在此處放入你的照片網址或相對路徑檔名
        const photos = [
            'images/202679.jpeg',
            'images/IMG_3139.jpeg',
            'images/IMG_4291.JPG',
            'images/IMG_4457.jpeg'
            'images/IMG_4622.jepg'
            'images/IMG_5063.JPG'
            'images/IMG_5706.jpeg'
            'images/IMG_5846.JPG'
        ];

        // 2. 隨機顯示的溫馨文字
        const messages = [
            '要想我喔！',
            '我想妳了！',
            '愛妳'
        ];

        function startDraw() {
            // 切換畫面
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('draw-screen').style.display = 'flex';

            const card = document.getElementById('card');
            const resultText = document.getElementById('result-text');
            const redrawBtn = document.getElementById('redraw-btn');

            // 播放洗牌/震動動畫 (持續 1.5 秒)
            card.classList.add('shuffling');

            setTimeout(() => {
                // 停止動畫
                card.classList.remove('shuffling');

                // 隨機選擇照片與文字
                const randomPhoto = photos[Math.floor(Math.random() * photos.length)];
                const randomMessage = messages[Math.floor(Math.random() * messages.length)];

                // 設置圖片與文字
                document.getElementById('photo').src = randomPhoto;
                resultText.innerText = randomMessage;

                // 翻牌動畫
                card.classList.add('flipped');

                // 翻牌後顯示文字與重新抽卡按鈕
                setTimeout(() => {
                    resultText.classList.add('show');
                    redrawBtn.style.display = 'inline-block';
                }, 400);

            }, 1500); // 1.5 秒抽卡動畫時間
        }

        function resetCard() {
            const card = document.getElementById('card');
            const resultText = document.getElementById('result-text');
            const redrawBtn = document.getElementById('redraw-btn');

            // 蓋牌並隱藏文字
            card.classList.remove('flipped');
            resultText.classList.remove('show');
            redrawBtn.style.display = 'none';

            // 稍微延遲後重新開始抽卡
            setTimeout(() => {
                startDraw();
            }, 500);
        }
    </script>
</body>
</html>

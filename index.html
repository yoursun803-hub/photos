<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>❤️ 想我的時候才能看喔！</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            min-height: 100vh;
            display: -webkit-flex;
            display: flex;
            -webkit-justify-content: center;
            justify-content: center;
            -webkit-align-items: center;
            align-items: center;
            text-align: center;
            color: #4a4a4a;
            overflow: hidden;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.92);
            padding: 35px 25px;
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(255, 107, 129, 0.18);
            max-width: 420px;
            width: 100%;
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
            position: relative;
        }

        h1 {
            font-size: 1.6rem;
            color: #e85d75;
            margin-bottom: 25px;
            line-height: 1.4;
            letter-spacing: 0.5px;
        }

        /* 按鈕樣式 (強化 Safari 點擊) */
        .btn {
            background-color: #ff6b81;
            color: white;
            border: none;
            padding: 14px 36px;
            font-size: 1.25rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 18px rgba(255, 107, 129, 0.4);
            transition: all 0.2s ease;
            outline: none;
            display: inline-block;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .btn:active {
            -webkit-transform: scale(0.96);
            transform: scale(0.96);
            background-color: #ff4757;
        }

        /* 抽卡區域 */
        .card-container {
            display: none;
            -webkit-flex-direction: column;
            flex-direction: column;
            -webkit-align-items: center;
            align-items: center;
            -webkit-justify-content: center;
            justify-content: center;
        }

        .card-wrapper {
            width: 240px;
            height: 320px;
            -webkit-perspective: 1000px;
            perspective: 1000px;
            margin-bottom: 20px;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            -webkit-transform-style: preserve-3d;
            transform-style: preserve-3d;
            -webkit-transition: -webkit-transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* 動畫 */
        @-webkit-keyframes shuffle {
            0% { -webkit-transform: rotate(0deg) scale(1); transform: rotate(0deg) scale(1); }
            25% { -webkit-transform: rotate(-12deg) scale(1.06) translateY(-12px); transform: rotate(-12deg) scale(1.06) translateY(-12px); }
            50% { -webkit-transform: rotate(12deg) scale(0.94) translateY(12px); transform: rotate(12deg) scale(0.94) translateY(12px); }
            75% { -webkit-transform: rotate(-6deg) scale(1.03); transform: rotate(-6deg) scale(1.03); }
            100% { -webkit-transform: rotate(0deg) scale(1); transform: rotate(0deg) scale(1); }
        }

        @keyframes shuffle {
            0% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(-12deg) scale(1.06) translateY(-12px); }
            50% { transform: rotate(12deg) scale(0.94) translateY(12px); }
            75% { transform: rotate(-6deg) scale(1.03); }
            100% { transform: rotate(0deg) scale(1); }
        }

        .shuffling {
            -webkit-animation: shuffle 0.5s ease-in-out infinite;
            animation: shuffle 0.5s ease-in-out infinite;
        }

        /* 卡片正面與背面 */
        .card-front, .card-back {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 18px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
            overflow: hidden;
        }

        .card-back {
            background: linear-gradient(45deg, #ff758c, #ff7eb3);
            border: 4px solid #ffffff;
            display: -webkit-flex;
            display: flex;
            -webkit-justify-content: center;
            justify-content: center;
            -webkit-align-items: center;
            align-items: center;
            color: white;
            z-index: 2;
            -webkit-transform: rotateY(0deg);
            transform: rotateY(0deg);
        }

        .card-back .heart-icon {
            font-size: 3.5rem;
            -webkit-animation: pulse 1.5s infinite;
            animation: pulse 1.5s infinite;
        }

        @-webkit-keyframes pulse {
            0% { -webkit-transform: scale(1); transform: scale(1); }
            50% { -webkit-transform: scale(1.15); transform: scale(1.15); }
            100% { -webkit-transform: scale(1); transform: scale(1); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        .card-front {
            background-color: white;
            border: 4px solid #ffffff;
            -webkit-transform: rotateY(180deg);
            transform: rotateY(180deg);
            display: -webkit-flex;
            display: flex;
            -webkit-align-items: center;
            align-items: center;
            -webkit-justify-content: center;
            justify-content: center;
            z-index: 1;
        }

        .card-front img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card.flipped {
            -webkit-transform: rotateY(180deg);
            transform: rotateY(180deg);
        }

        .result-text {
            font-size: 1.45rem;
            font-weight: bold;
            color: #ff4757;
            opacity: 0;
            transition: opacity 0.5s ease;
            margin-top: 10px;
            min-height: 2em;
        }

        .result-text.show {
            opacity: 1;
        }

        .re-draw-btn {
            margin-top: 12px;
            display: none;
            background-color: #70a1ff;
            box-shadow: 0 4px 15px rgba(112, 161, 255, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 初始畫面 -->
        <div id="start-screen">
            <h1>❤️ 想我的時候才能看喔！</h1>
            <button id="draw-btn" class="btn">請抽卡！</button>
        </div>

        <!-- 抽卡與結果畫面 -->
        <div id="draw-screen" class="card-container">
            <div class="card-wrapper">
                <div class="card" id="card">
                    <div class="card-back">
                        <div class="heart-icon">❤️</div>
                    </div>
                    <div class="card-front">
                        <img id="photo" src="" alt="照片">
                    </div>
                </div>
            </div>
            <div class="result-text" id="result-text"></div>
            <button id="redraw-btn" class="btn re-draw-btn">再抽一次</button>
        </div>
    </div>

    <script>
        const photos = [
            'images/202679.jpeg',
            'images/IMG_3139.jpeg',
            'images/IMG_4291.JPG',
            'images/IMG_4457.jpeg'
            'images/IMG_4622.jepg'
            'images/IMG_5063.JPG'
            'images/IMG_5706.jpeg'
            'images/IMG_5846.JPG'
        ];

        const messages = [
            '要想我喔！',
            '我想妳了！',
            '愛妳'
        ];

        let isProcessing = false;

        function startDraw() {
            if (isProcessing) return;
            isProcessing = true;

            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('draw-screen').style.display = 'flex';

            const card = document.getElementById('card');
            const resultText = document.getElementById('result-text');
            const redrawBtn = document.getElementById('redraw-btn');

            card.classList.add('shuffling');

            setTimeout(() => {
                card.classList.remove('shuffling');

                const randomPhoto = photos[Math.floor(Math.random() * photos.length)];
                const randomMessage = messages[Math.floor(Math.random() * messages.length)];

                document.getElementById('photo').src = randomPhoto;
                resultText.innerText = randomMessage;

                card.classList.add('flipped');

                setTimeout(() => {
                    resultText.classList.add('show');
                    redrawBtn.style.display = 'inline-block';
                    isProcessing = false;
                }, 400);

            }, 1500);
        }

        function resetCard() {
            if (isProcessing) return;

            const card = document.getElementById('card');
            const resultText = document.getElementById('result-text');
            const redrawBtn = document.getElementById('redraw-btn');

            card.classList.remove('flipped');
            resultText.classList.remove('show');
            redrawBtn.style.display = 'none';

            setTimeout(() => {
                startDraw();
            }, 500);
        }

        // 為點擊事件做跨平台監聽 (同時相容手機觸控 touchstart 與滑鼠 click)
        const drawBtn = document.getElementById('draw-btn');
        const redrawBtn = document.getElementById('redraw-btn');

        ['click', 'touchstart'].forEach(eventType => {
            drawBtn.addEventListener(eventType, function(e) {
                e.preventDefault();
                startDraw();
            }, { passive: false });

            redrawBtn.addEventListener(eventType, function(e) {
                e.preventDefault();
                resetCard();
            }, { passive: false });
        });
    </script>
</body>
</html>

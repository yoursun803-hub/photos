<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>❤️ 想我的時候才能看喔！</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #4a4a4a;
            overflow: hidden;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 35px 25px;
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(255, 107, 129, 0.2);
            max-width: 400px;
            width: 100%;
        }

        h1 {
            font-size: 1.5rem;
            color: #e85d75;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        /* 經典 Safari 可點擊按鈕設計 */
        .btn {
            background-color: #ff6b81;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.25rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 18px rgba(255, 107, 129, 0.4);
            display: inline-block;
            user-select: none;
            -webkit-user-select: none;
            outline: none;
        }

        .btn:active {
            transform: scale(0.95);
            background-color: #ff4757;
        }

        .card-container {
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .card-wrapper {
            width: 240px;
            height: 320px;
            margin-bottom: 20px;
            position: relative;
        }

        /* 洗牌動畫 */
        @keyframes shuffle {
            0% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(-10deg) scale(1.05); }
            50% { transform: rotate(10deg) scale(0.95); }
            75% { transform: rotate(-5deg) scale(1.02); }
            100% { transform: rotate(0deg) scale(1); }
        }

        .shuffling {
            animation: shuffle 0.4s ease-in-out infinite;
        }

        /* 卡片區域 */
        .card-box {
            width: 100%;
            height: 100%;
            border-radius: 18px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            overflow: hidden;
            background-color: white;
            border: 4px solid #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .card-back-view {
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #ff758c, #ff7eb3);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 3.5rem;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
        }

        .card-front-view {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .card-front-view img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .result-text {
            font-size: 1.4rem;
            font-weight: bold;
            color: #ff4757;
            margin-top: 10px;
            min-height: 2em;
            visibility: hidden;
        }

        .re-draw-btn {
            margin-top: 12px;
            display: none;
            background-color: #70a1ff;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 畫面一：點擊抽卡 -->
        <div id="start-screen">
            <h1>❤️ 想我的時候才能看喔！</h1>
            <button id="draw-btn" class="btn">請抽卡！</button>
        </div>

        <!-- 畫面二：抽卡動畫與結果 -->
        <div id="draw-screen" class="card-container">
            <div class="card-wrapper">
                <div class="card-box" id="card-box">
                    <div class="card-back-view" id="card-back">❤️</div>
                    <div class="card-front-view">
                        <img id="photo" src="" alt="照片">
                    </div>
                </div>
            </div>
            <div class="result-text" id="result-text"></div>
            <button id="redraw-btn" class="btn re-draw-btn">再抽一次</button>
        </div>
    </div>

    <script>
        const photos = [
            'images/photo1.jpg',
            'images/photo2.jpg',
            'images/photo3.jpg',
            'images/photo4.jpg',
            'images/photo5.jpg',
            'images/photo6.jpg',
            'images/photo7.jpg',
            'images/photo8.jpg',
            'images/photo9.jpg',
            'images/photo10.jpg',
            'images/photo11.jpg'
        ];

        const messages = ['要想我喔！', '我想妳了！', '愛妳', '想麻糬公主！', '吃妳', '想抱抱', '快回來！！'];

        // 預先載入圖片（解決 Safari 點擊延遲問題）
        photos.forEach(src => {
            const img = new Image();
            img.src = src;
        });

        const startScreen = document.getElementById('start-screen');
        const drawScreen = document.getElementById('draw-screen');
        const cardBox = document.getElementById('card-box');
        const cardBack = document.getElementById('card-back');
        const photo = document.getElementById('photo');
        const resultText = document.getElementById('result-text');
        const drawBtn = document.getElementById('draw-btn');
        const redrawBtn = document.getElementById('redraw-btn');

        function executeDraw() {
            startScreen.style.display = 'none';
            drawScreen.style.display = 'flex';
            cardBack.style.display = 'flex';
            resultText.style.visibility = 'hidden';
            redrawBtn.style.display = 'none';

            // 開始洗牌動畫
            cardBox.classList.add('shuffling');

            setTimeout(() => {
                // 停止動畫
                cardBox.classList.remove('shuffling');

                // 隨機選取
                const randomPhoto = photos[Math.floor(Math.random() * photos.length)];
                const randomMessage = messages[Math.floor(Math.random() * messages.length)];

                photo.src = randomPhoto;
                resultText.innerText = randomMessage;

                // 揭曉卡片
                cardBack.style.display = 'none';
                resultText.style.visibility = 'visible';
                redrawBtn.style.display = 'inline-block';
            }, 1200);
        }

        // 綁定 Safari 通用點擊事件
        function bindClick(element, handler) {
            element.addEventListener('touchend', function(e) {
                handler();
            }, false);
            element.addEventListener('click', function(e) {
                handler();
            }, false);
        }

        bindClick(drawBtn, executeDraw);
        bindClick(redrawBtn, executeDraw);
    </script>
</body>
</html>
